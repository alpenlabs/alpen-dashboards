# Dashboard backend configuration
datadir = "data"

# API server configuration
[server]
  host = "0.0.0.0"
  port = 3000

# Network monitoring configuration
[network]
  alpen_rpc_url                 = "https://alpen.staging.testnet.alpenlabs.dev"
  alpen_sequencer_url           = "http://localhost:56917/"
  bundler_url                   = "https://bundler.staging.testnet.alpenlabs.dev/health"
  initial_status_wait_timeout_s = 30
  status_refetch_interval_s     = 10
  strata_rpc_url                = "https://strata.staging.testnet.alpenlabs.dev"
  strata_sequencer_url          = "http://localhost:56790/"

  # Request retry policy; growth is fixed at 1.5x, matching bridge retries.
  [network.retry]
    base_delay_ms = 2_000
    max_delay_ms  = 5_000
    max_retries   = 3

# Bridge monitoring configuration
[bridge]
  esplora_request_timeout_s     = 5
  esplora_url                   = "https://esplora.staging.testnet.alpenlabs.dev"
  initial_status_wait_timeout_s = 5
  max_tx_confirmations          = 6
  status_refetch_interval_s     = 120
  withdrawal_pairing_batch_size = 1_000

  # Shared request retry policy for bridge RPC and Esplora; growth is fixed at 1.5x.
  [bridge.retry]
    base_delay_ms = 2_000
    max_delay_ms  = 5_000
    max_retries   = 3

  # Bridge operators configuration
  [[bridge.operators]]
    name       = "Alpen Labs #1"
    public_key = "025f9bfac3b160a0b9129d558ce29ab2df66ebbdd85dec1f5a2faf2e9de07acdfd"
    rpc_url    = "http://localhost:55936"

  [[bridge.operators]]
    name       = "Alpen Labs #2"
    public_key = "027098a1e38159f586536fabcb5537cdbb1454b1464c5c4a1bfd48de6c794d28c4"
    rpc_url    = "http://localhost:56062"

  [[bridge.operators]]
    name       = "Alpen Labs #3"
    public_key = "0288610184701307eef5dbb81ce1d974bc6940d21601a9656b565dab485321a03f"
    rpc_url    = "http://localhost:56135"

